<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique:wght@400;500;700;900&family=Poppins:wght@400;500;600;700;800&display=swap');


:root {
  --blue: #3852C7;
  --blue-soft: #EAEDFB;
  --blue-dark: #2C40A0;
  --purple: #7C5CFC;
  --purple-soft: #EFEAFE;
  --bg: #f1f1f1;
  --card: #FFFFFF;
  --ink: #22283A;
  --ink-soft: #7B8098;
  --ink-faint: #ACB0C2;
  --border: #E3E3E3;
  --danger: #D64545;
  --good: #2E9B5C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #5C74E0;
    --blue-soft: #202748;
    --blue-dark: #7C90EE;
    --purple: #A48CFF;
    --purple-soft: #2A2340;
    --bg: #12141C;
    --card: #1B1F2C;
    --ink: #ECEDF3;
    --ink-soft: #9BA0B5;
    --ink-faint: #656B80;
    --border: #2A2E3D;
    --danger: #E77373;
    --good: #6FCB93;
  }
}
:root[data-theme="dark"] {
  --blue: #5C74E0;
  --blue-soft: #202748;
  --blue-dark: #7C90EE;
  --purple: #A48CFF;
  --purple-soft: #2A2340;
  --bg: #12141C;
  --card: #1B1F2C;
  --ink: #ECEDF3;
  --ink-soft: #9BA0B5;
  --ink-faint: #656B80;
  --border: #2A2E3D;
  --danger: #E77373;
  --good: #6FCB93;
}

* { box-sizing: border-box; }

html, body {
  overflow-x: hidden;
  width: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Zen Kaku Gothic Antique", "Poppins", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.num { font-family: "Poppins", "Zen Kaku Gothic Antique", sans-serif; }

.status-strip {
  height: 8px;
  background: var(--blue);
}

.app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  padding-bottom: 92px;
  position: relative;
  overflow-x: hidden;
}

.view { padding: 20px 20px 8px; }

/* ---------- shared bits ---------- */
.card {
  background: var(--card);
  border-radius: 18px;
  padding: 18px 18px 6px;
  margin-bottom: 16px;
  box-shadow: 0 2px 14px rgba(30, 40, 90, 0.06);
}
.section {
  padding: 12px 0 14px;
  border-bottom: 1px solid var(--border);
}
.section:last-child { border-bottom: none; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.section-head .label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 16px;
}
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot.blue { background: var(--blue); }
.dot.purple { background: var(--purple); }
.section-head .total { font-weight: 600; font-size: 16px; }
.item-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 5px 0;
  font-size: 0.86rem;
}
.item-line .name { color: var(--ink-soft); }
.item-line .name.paren { color: var(--ink-faint); }
.item-line .value { font-weight: 500; white-space: nowrap; }
.item-memo { font-size: 0.72rem; color: var(--ink-faint); padding: 0 0 4px; margin-top: -3px; }

.btn {
  border: none;
  font-family: inherit;
  cursor: pointer;
  border-radius: 14px;
  font-weight: 700;
  transition: opacity .15s;
}
.btn:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--blue); color: #fff; padding: 13px 20px; font-size: 0.95rem; width: 100%; }
.btn-ghost { background: var(--blue-soft); color: var(--blue); padding: 9px 16px; font-size: 0.82rem; }
.btn-outline { background: transparent; color: var(--ink-soft); border: 1px solid var(--border); padding: 8px 14px; font-size: 0.8rem; border-radius: 12px; }
.btn-text-danger { background: none; color: var(--danger); font-size: 0.8rem; padding: 6px 4px; text-decoration: underline; }

/* ---------- bottom nav ---------- */
.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 460px;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 20px;
  z-index: 20;
}
.nav-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--blue);
  background-color: #fff;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.10);
  border: none;
  cursor: pointer;
}
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn.active { background: var(--blue); color: #fff; }

/* ---------- home ---------- */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0 18px;
}
.month-nav button {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 12px;
  font-weight: 700;
  padding: 4px;
}
.month-nav button svg { width: 20px; height: 20px; }
.month-nav .center { 
  display: flex;
  flex-direction: column;
  text-align: center; 
  gap: 3px;
}
.month-nav .year { font-size: 16px; font-weight: 700;}
.month-nav .month { font-size: 30px; font-weight: 700; line-height: 1; }
.month-nav .payment { font-size: 10px; font-weight: 500;}

.total-block { text-align: center; padding: 4px 0 18px; }
.total-block .big { font-size: 32px; font-weight: 700; color: var(--blue); }
.breakdown-pill {
  display: inline-block;
  background: var(--purple-soft);
  color: var(--purple);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 0.8rem;
  font-weight: 600;
  margin-top: 8px;
}
.deposit-row {
  font-size: 12px;
  color: var(--ink-soft);
}
.deposit-row .amt { font-weight: 700; color: var(--ink); }
.match-note { margin-top: 6px; font-size: 0.76rem; }
.match-note.good { color: var(--good); }
.match-note.bad { color: var(--danger); }

.empty-card {
  text-align: center;
  padding: 44px 20px;
  color: var(--ink-faint);
  font-size: 0.85rem;
}
.empty-card .btn-primary { width: auto; margin-top: 14px; display: inline-block; }

.card-actions {
  display: flex;
  justify-content: flex-end;
  gap: 14px;
  padding: 10px 2px 4px;
  font-size: 0.78rem;
}
.card-actions button { background: none; border: none; cursor: pointer; color: var(--ink-soft); }
.card-actions button.danger { color: var(--danger); }

/* ---------- list view ---------- */
.list-row {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  box-shadow: 0 1px 8px rgba(30,40,90,0.05);
}
.list-row .ym { font-weight: 700; font-size: 0.95rem; }
.list-row .amt { font-weight: 700; }
.list-row .badge { font-size: 0.68rem; padding: 3px 9px; border-radius: 10px; margin-top: 4px; display: inline-block; }
.badge.good { background: #E4F6EB; color: var(--good); }
.badge.bad { background: #FBEAEA; color: var(--danger); }
.badge.pending { background: var(--blue-soft); color: var(--blue); }
.list-heading { font-size: 0.8rem; color: var(--ink-soft); font-weight: 700; margin: 22px 0 10px; }

/* ---------- camera / entry form ---------- */
.cam-header { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 800; margin-bottom: 16px; }
.cam-header svg { width: 24px; height: 24px; color: var(--blue); }

.photo-pick-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 20px;
  border: none;
  border-radius: 14px;
  background: var(--blue);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.photo-pick-btn svg { width: 22px; height: 22px; }
.photo-pick-btn.is-change {
  background: var(--blue-soft);
  color: var(--blue);
  padding: 12px 20px;
  font-size: 14px;
}
.photo-pick-sub {
  text-align: center;
  font-size: 12px;
  color: var(--ink-faint);
  margin: 8px 0 18px;
}
.photo-preview {
  width: 100%;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 10px;
}
.photo-preview img { width: 100%; height: auto; display: block; }

.ocr-progress {
  background: var(--blue-soft);
  color: var(--blue-dark);
  border-radius: 12px;
  padding: 14px;
  font-size: 13px;
  margin: 14px 0;
}
.ocr-bar { height: 6px; border-radius: 3px; background: rgba(56,82,199,0.18); margin-top: 10px; overflow: hidden; }
.ocr-bar > div { height: 100%; background: var(--blue); width: 0%; transition: width .2s; }
.ocr-result-note { font-size: 12px; color: var(--ink-soft); margin: 10px 0 4px; line-height: 1.6; }
.ocr-result-note.err { color: var(--danger); }
.ocr-tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
.ocr-tools button {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; color: var(--ink-soft); font-family: inherit; cursor: pointer;
}
.ocr-raw { margin: 8px 0 4px; font-size: 12px; }
.ocr-raw summary { cursor: pointer; color: var(--blue); font-weight: 700; }
.ocr-raw pre {
  white-space: pre-wrap; word-break: break-all;
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; max-height: 240px; overflow: auto; font-size: 11px; color: var(--ink-soft);
  font-family: inherit; user-select: text; -webkit-user-select: text;
}

.step-heading { display: flex; align-items: center; gap: 6px; margin: 20px 0 14px; }
.step-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--blue); color: #fff;
  font-size: 12px; font-weight: 700;  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.step-heading .txt { font-weight: 700; color: var(--blue); font-size: 16px; }

.step-heading + .section {
  padding-top: 0;
}

.radio-item {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 2px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}
.radio-item input { display: none; }
.radio-dot {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--border); background-color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.radio-item input:checked + .radio-dot { border-color: var(--blue); }
.radio-item input:checked + .radio-dot::after {
  content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue);
}

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 0.76rem; color: var(--ink-soft); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 5px;
  padding: 10px 12px;
  font-size: 14px;
}
.field select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  padding-right: 34px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237B8098' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 16px 16px;
}
.field input:focus, .field select:focus, .field textarea:focus, button:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 1px;
}

.entry-row {
  display: grid;
  grid-template-columns: 1.3fr 1fr auto;
  gap: 8px;
  margin-bottom: 2px;
  align-items: center;
}
.entry-row input { font-size: 14px; padding: 10px; border: solid 1px var(--border); border-radius: 5px;min-width: 0; width: 100%; height: 38px;}
.entry-row input.amt-input { text-align: right; font-family: "Poppins","Zen Kaku Gothic Antique",sans-serif; }
.entry-row .rm { background: none; border: none; color: var(--ink-faint); font-size: 1rem; cursor: pointer; padding: 4px; }
.entry-memo-input {
  width: 100%;
  border: none;
  border-bottom: 1px dashed var(--border);
  background: transparent;
  font-size: 12px;
  color: var(--ink-faint);
  padding: 3px 2px 8px;
  font-family: inherit;
}
.entry-memo-input::placeholder { color: var(--ink-faint); }
.entry-memo-input + .entry-row {
  margin: 10px 0 0;
}
.add-item-btn {
  background: none; border: none; color: var(--blue);
  font-size: 0.8rem; font-weight: 700; cursor: pointer;
  padding: 6px 2px; margin-top: 4px;
}

.status-line { font-size: 0.76rem; color: var(--ink-faint); margin-top: 6px; min-height: 1.1em; }
.status-line.err { color: var(--danger); }

.info-note {
  background: var(--blue-soft);
  color: var(--blue-dark);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 0.8rem;
  margin-bottom: 16px;
}

.top-banner {
  font-size: 0.78rem;
  color: var(--ink-soft);
  background: var(--card);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 14px;
}

.sticky-save {
  position: sticky;
  bottom: 0;
  background: linear-gradient(to top, var(--bg) 60%, transparent);
  padding: 14px 0 6px;
}
</style>
</head>
<body>
<div class="status-strip"></div>
<div class="app">
  <div id="view" class="view"></div>
</div>
<div class="bottom-nav">
  <button class="nav-btn" id="navCamera" title="読み取る"></button>
  <button class="nav-btn" id="navHome" title="ホーム"></button>
  <button class="nav-btn" id="navList" title="一覧"></button>
</div>

/* ============ helpers ============ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function yen(n) { if (n === null || n === undefined || isNaN(n)) return "―"; return "¥" + Math.round(n).toLocaleString("ja-JP"); }
function esc(v) { return String(v ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function uid(p) { return (p||"id") + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function ymParts(ym) { const [y,m] = ym.split("-").map(Number); return {y, m}; }
function ymAdd(ym, delta) {
  let {y,m} = ymParts(ym);
  m += delta;
  while (m > 12) { m -= 12; y += 1; }
  while (m < 1) { m += 12; y -= 1; }
  return y + "-" + String(m).padStart(2,"0");
}
function ymLabelMonth(ym) { return ymParts(ym).m + "月"; }
function ymLabelYear(ym) { return String(ymParts(ym).y); }
function ymLabelShort(ym) { const p = ymParts(ym); return p.y + "/" + String(p.m).padStart(2,"0"); }
function paymentLabel(ym, paymentYm) {
  const pm = paymentYm ? ymParts(paymentYm).m : ymParts(ymAdd(ym,1)).m;
  return "(" + pm + "月支給)";
}
function currentRealYM() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

function sumAmt(list) { return (list||[]).reduce((s,it)=> s + (parseFloat(it.amount)||0), 0); }

function computeMonth(doc) {
  const earningsTotal = sumAmt(doc.earnings);
  const deductionsTotal = sumAmt(doc.deductions);
  const otherTotal = sumAmt(doc.other);
  const netPay = earningsTotal - deductionsTotal + otherTotal;
  const bonusEarningsTotal = sumAmt(doc.bonusEarnings);
  const bonusDeductionsTotal = sumAmt(doc.bonusDeductions);
  const bonusNet = bonusEarningsTotal - bonusDeductionsTotal;
  const combined = netPay + (doc.hasBonus ? bonusNet : 0);
  return { earningsTotal, deductionsTotal, otherTotal, netPay, bonusEarningsTotal, bonusDeductionsTotal, bonusNet, combined };
}

/* ============ local storage (IndexedDB) ============ */
let dbReady=true, assetsReady=true;
const ocr = { running: false, progress: 0, phase: "", text: null, msg: "", msgErr: false, seq: 0 };
let months = [];       // loaded from this device's IndexedDB, sorted desc by yearMonth
let withholdings = [];

function openLocalDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("payslipLedgerDB", 1);
    req.onupgradeneeded = (e) => {
      const idb = e.target.result;
      if (!idb.objectStoreNames.contains("months")) idb.createObjectStore("months", { keyPath: "yearMonth" });
      if (!idb.objectStoreNames.contains("withholdings")) idb.createObjectStore("withholdings", { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
let _idb = null;
async function getLocalDB() { if (!_idb) _idb = await openLocalDB(); return _idb; }
async function idbGetAll(store) {
  const idb = await getLocalDB();
  return new Promise((resolve, reject) => {
    const req = idb.transaction(store, "readonly").objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(store, value) {
  const idb = await getLocalDB();
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, "readwrite");
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDelete(store, key) {
  const idb = await getLocalDB();
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, "readwrite");
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}
async function reloadLocalData() {
  months = (await idbGetAll("months")).sort((a,b)=> b.yearMonth.localeCompare(a.yearMonth));
  withholdings = (await idbGetAll("withholdings")).sort((a,b)=> String(b.year).localeCompare(String(a.year)));
  if (state.view === "home" && !state.currentYM) state.currentYM = months[0] ? months[0].yearMonth : currentRealYM();
  render();
}

async function initCapabilities() {
  await reloadLocalData();
}

function depositRow(doc, expected) {
  if (doc.actualDeposit == null) {
    return `<div class="deposit-row">振込支給額 <span class="amt num">未入力</span></div>`;
  }
  const diff = doc.actualDeposit - expected;
  let note = "";
  if (diff === 0) note = `<div class="match-note good">✓ 計算どおりに振り込まれています</div>`;
  else note = `<div class="match-note bad">差額 ${yen(Math.abs(diff))}（${diff>0?"多く振り込まれています":"不足しています"}）</div>`;
  return `<div class="deposit-row">振込支給額 <span class="amt num">${yen(doc.actualDeposit)}</span></div>${note}`;
}

/* ============ LIST ============ */
function renderList() {
  if (!months.length && !withholdings.length) {
    return `<div class="card"><div class="empty-card">まだ明細が登録されていません。</div></div>`;
  }
  let html = "";
  if (months.length) {
    html += `<div class="list-heading">給与明細</div>`;
    html += months.map(doc => {
      const c = computeMonth(doc);
      const total = doc.hasBonus ? c.combined : c.netPay;
      let badge = `<span class="badge pending">未入力</span>`;
      if (doc.actualDeposit != null) {
        badge = doc.actualDeposit - total === 0 ? `<span class="badge good">一致</span>` : `<span class="badge bad">要確認</span>`;
      }
      return `<div class="list-row" data-goto-ym="${doc.yearMonth}">
        <div><div class="ym">${ymLabelYear(doc.yearMonth)}年${ymLabelMonth(doc.yearMonth)}分</div>${badge}</div>
        <div class="amt num">${yen(total)}</div>
      </div>`;
    }).join("");
  }
  if (withholdings.length) {
    html += `<div class="list-heading">源泉徴収票</div>`;
    html += withholdings.map(w => `
      <div class="list-row" data-goto-withholding="${w.id}">
        <div class="ym">${esc(w.year)}年分</div>
        <div class="amt num">${yen(w.amount)}</div>
      </div>`).join("");
  }
  return html;
}

function bindViewEvents() {
  $("#navCamera").onclick = () => { state.view = "camera"; if (!state.camForm) state.camForm = newRegularForm(state.currentYM); render(); };
  $("#navHome").onclick = () => { state.view = "home"; render(); };
  $("#navList").onclick = () => { state.view = "list"; render(); };

  if (state.view === "home") bindHomeEvents();
  else if (state.view === "list") bindListEvents();

}

function bindHomeEvents() {
  $$("[data-nav-ym]").forEach(b => b.onclick = () => { state.currentYM = b.dataset.navYm; render(); });
  const addBtn = $("#addForThisMonth");
  if (addBtn) addBtn.onclick = () => openCamera("regular", state.currentYM);
  const editBtn = $("[data-edit-regular]");
  if (editBtn) editBtn.onclick = () => openCamera("regular", editBtn.dataset.editRegular);
  const bonusBtn = $("[data-open-bonus]");
  if (bonusBtn) bonusBtn.onclick = () => openCamera("bonus", bonusBtn.dataset.openBonus);
  const delBtn = $("[data-delete-month]");
  if (delBtn) delBtn.onclick = () => deleteMonth(delBtn.dataset.deleteMonth);
}

function bindListEvents() {
  $$("[data-goto-ym]").forEach(row => row.onclick = () => { state.currentYM = row.dataset.gotoYm; state.view = "home"; render(); });
}

async function deleteMonth(ym) {
  if (!confirm(ym + " の明細を削除しますか？")) return;
  try { await idbDelete("months", ym); await reloadLocalData(); } catch(e) { console.error(e); alert("削除に失敗しました。"); }
}

function bindCameraEvents() {
  $$('input[name="cat"]').forEach(r => r.onchange = (e) => {
    const oldForm = state.camForm;
    const newCat = e.target.value;
    state.camCategory = newCat;
    const ym = oldForm && oldForm.yearMonth;
    let newForm;
    if (newCat === "regular") newForm = newRegularForm(ym);
    else if (newCat === "bonus") newForm = newBonusForm(oldForm && oldForm.targetYearMonth);
    else newForm = newWithholdingForm();
    // keep the photo the viewer already captured when switching category
    if (oldForm && (oldForm.photoFile || oldForm.photoPreviewUrl)) {
      newForm.photoFile = oldForm.photoFile;
      newForm.photoDataUrl = oldForm.photoDataUrl;
      newForm.photoPreviewUrl = oldForm.photoPreviewUrl;
    }
    state.camForm = newForm;
    if (ocr.text) applyOcrText(ocr.text);
    render();
  });

  if (assetsReady) {
    $("#photoBox").onclick = () => $("#photoInput").click();
    $("#photoInput").onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      state.camForm.photoFile = file;
      state.camForm.photoDataUrl = null;
      state.camForm.photoPreviewUrl = URL.createObjectURL(file);
      ocr.text = null; ocr.msg = ""; ocr.msgErr = false;
      runOcr(file);
    };
  }

  const f = state.camForm;
  const hasPhoto = !!f.photoPreviewUrl;
  if (hasPhoto && !ocr.running) {
    if (state.camCategory === "regular") {
      $("#f-yearMonth").oninput = (e) => { f.yearMonth = e.target.value; };
      $("#f-paymentMonth").oninput = (e) => { f.paymentMonth = e.target.value; };
      $("#f-actualDeposit").oninput = (e) => { f.actualDeposit = e.target.value; };
      $("#f-note").oninput = (e) => { f.note = e.target.value; };
      bindItemRows(["attendance","earnings","deductions","other"]);
    } else if (state.camCategory === "bonus") {
      const sel = $("#f-targetYM");
      if (sel) sel.onchange = (e) => { f.targetYearMonth = e.target.value; };
      bindItemRows(["bonusEarnings","bonusDeductions"]);
    } else {
      $("#f-year").oninput = (e) => { f.year = e.target.value; };
      $("#f-amount").oninput = (e) => { f.amount = e.target.value; };
      $("#f-memo").oninput = (e) => { f.memo = e.target.value; };
    }

    $$(".add-item-btn").forEach(btn => btn.onclick = () => {
      const sec = btn.dataset.add;
      const proto = sec === "attendance" ? {id:uid(),name:"",value:"",memo:""} : {id:uid(),name:"",amount:"",memo:""};
      f[sec].push(proto);
      render();
    });
  }

  const retryBtn = $("#ocrRetry");
  if (retryBtn) retryBtn.onclick = () => { if (state.camForm.photoFile) runOcr(state.camForm.photoFile); };

  const saveBtn = $("#saveCamBtn");
  if (saveBtn) saveBtn.onclick = saveCamera;
}

function bindItemRows(sections) {
  const f = state.camForm;
  sections.forEach(sec => {
    $$(`.entry-row[data-section="${sec}"]`).forEach(row => {
      const id = row.dataset.id;
      const item = f[sec].find(it => it.id === id);
      row.querySelector(".f-name").oninput = (e) => { item.name = e.target.value; };
      const amtInput = row.querySelector(".amt-input, .val-input");
      amtInput.oninput = (e) => { if (sec==="attendance") item.value = e.target.value; else item.amount = e.target.value; };
      row.querySelector(".rm").onclick = () => { f[sec] = f[sec].filter(it => it.id !== id); render(); };
    });
    $$(`.entry-memo-input[data-memo]`).forEach(inp => {
      const item = f[sec] && f[sec].find(it => it.id === inp.dataset.memo);
      if (item) inp.oninput = (e) => { item.memo = e.target.value; };
    });
  });
}

/* ============ OCR (Tesseract.js, runs on this device) ============ */
const TESSERACT_SRC = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let tesseractLoading = null;
let ocrWorker = null;

function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = TESSERACT_SRC;
    sc.onload = () => resolve();
    sc.onerror = () => { tesseractLoading = null; reject(new Error("load_failed")); };
    document.head.appendChild(sc);
  });
  return tesseractLoading;
}

const OCR_PHASES = {
  "loading tesseract core": "② 読み取りエンジンを起動中…",
  "initializing tesseract": "② 読み取りエンジンを起動中…",
  "loading language traineddata": "③ 日本語データを読み込み中…（初回のみ時間がかかります）",
  "initializing api": "③ 日本語データを準備中…",
  "recognizing text": "⑤ 文字を読み取っています…",
};
function updateOcrProgressUI() {
  const ph = document.getElementById("ocrPhase");
  const bar = document.getElementById("ocrBar");
  if (ph) ph.textContent = ocr.phase;
  if (bar) bar.style.width = Math.round(ocr.progress * 100) + "%";
}

const TESS_PATHS = {
  workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
  corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",
  langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn/4.0.0_best_int",
};
function withTimeout(promise, ms, stepName) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error("timeout:" + stepName)), ms)),
  ]);
}
function setOcrStep(text) { ocr.phase = text; updateOcrProgressUI(); }

async function getOcrWorker() {
  if (ocrWorker) return ocrWorker;
  setOcrStep("① 読み取りエンジンを読み込み中…");
  await withTimeout(loadTesseract(), 60000, "エンジンの読み込み");
  setOcrStep("② 読み取りエンジンを起動中…");
  let workerError = null;
  const created = Tesseract.createWorker("jpn", 1, {
    ...TESS_PATHS,
    workerBlobURL: true,
    errorHandler: (err) => { workerError = err; console.error("tesseract worker error", err); },
    logger: (m) => {
      if (!ocr.running) return;
      ocr.phase = OCR_PHASES[m.status] || ocr.phase || "読み取り中…";
      if (typeof m.progress === "number") ocr.progress = m.progress;
      updateOcrProgressUI();
    },
  });
  try {
    ocrWorker = await withTimeout(created, 180000, "エンジンの起動・日本語データの読み込み");
  } catch (e) {
    if (workerError) e.detail = String(workerError && (workerError.message || workerError));
    throw e;
  }
  return ocrWorker;
}

// shrink + grayscale + contrast stretch: helps accuracy and speed on phone photos
function preprocessImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, MAX / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      const im = ctx.getImageData(0, 0, w, h);
      const d = im.data;
      let min = 255, max = 0;
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        d[i] = g;
        if (g < min) min = g;
        if (g > max) max = g;
      }
      const range = Math.max(1, max - min);
      for (let i = 0; i < d.length; i += 4) {
        const v = ((d[i] - min) / range) * 255;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(im, 0, 0);
      URL.revokeObjectURL(url);
      resolve(cv);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image_load_failed")); };
    img.src = url;
  });
}

async function runOcr(file) {
  const mySeq = ++ocr.seq;
  ocr.running = true; ocr.progress = 0; ocr.phase = "読み取りの準備中…";
  ocr.msg = ""; ocr.msgErr = false;
  render();
  try {
    const worker = await getOcrWorker();
    setOcrStep("④ 写真を準備中…");
    const canvas = await withTimeout(preprocessImage(file), 30000, "写真の準備");
    setOcrStep("⑤ 文字を読み取っています…");
    const { data } = await withTimeout(worker.recognize(canvas), 180000, "文字の読み取り");
    if (mySeq !== ocr.seq) return; // a newer photo was chosen meanwhile
    ocr.text = (data && data.text) ? data.text : "";
    const n = applyOcrText(ocr.text);
    if (state.camCategory === "withholding") {
      ocr.msg = n ? "支払金額らしき数字を入力しました。内容を確認してください。" : "読み取りましたが、金額を特定できませんでした。下の「読み取った文字を見る」を参考に入力してください。";
    } else {
      ocr.msg = n
        ? `${n}件の項目を自動で入力しました。読み間違いがあることがあるので、必ず写真と見比べて確認してください。`
        : "項目を自動で振り分けられませんでした。下の「読み取った文字を見る」を参考に入力してください。";
    }
    ocr.msgErr = !n;
  } catch (e) {
    console.error(e);
    if (mySeq !== ocr.seq) return;
    ocr.text = null;
    ocr.msgErr = true;
    const msg = String((e && e.message) || e || "");
    let reason;
    if (msg === "load_failed") reason = "読み取りエンジンを読み込めませんでした（通信が遮断されている可能性があります）。";
    else if (msg.startsWith("timeout:")) reason = `「${msg.slice(8)}」の段階で時間切れになりました。`;
    else if (msg === "image_load_failed") reason = "写真を読み込めませんでした。別の写真でお試しください。";
    else reason = "読み取り中にエラーが発生しました。";
    const detail = (e && e.detail) ? e.detail : (msg && !msg.startsWith("timeout:") && msg !== "load_failed" ? msg : "");
    ocr.msg = reason + (detail ? `（詳細: ${detail}）` : "") + " 手動で入力するか、「もう一度読み取る」をお試しください。";
    // a failed worker can't be reused
    try { if (ocrWorker) await ocrWorker.terminate(); } catch (_) {}
    ocrWorker = null;
  } finally {
    if (mySeq === ocr.seq) { ocr.running = false; render(); }
  }
}

/* ---------- parsing ---------- */
function normalizeOcrText(t) {
  return String(t || "")
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[，、]/g, ",").replace(/[．]/g, ".")
    .replace(/[￥\\]/g, "¥").replace(/[－―ー−]/g, m => m === "ー" ? "ー" : "-")
    .replace(/[（]/g, "(").replace(/[）]/g, ")")
    .replace(/\r/g, "");
}
// Tesseract often puts spaces between Japanese characters: join them, but keep spaces around numbers
function joinJapaneseSpaces(line) {
  let prev;
  do {
    prev = line;
    line = line.replace(/([^\d\s,.\-¥])\s+([^\d\s,.\-¥])/g, "$1$2");
  } while (line !== prev);
  return line;
}

const RE_SKIP  = /(合計|総額|小計|差引|支給額計|控除額計|総支給|振込|口座|銀行|氏名|社員|番号|所属|部署|コード|ページ)/;
const RE_OTHER = /(還付|調整|精算|立替|返金)/;
const RE_DED   = /(保険|年金|所得税|住民税|源泉|控除|組合費|社宅|寮費|財形|積立|子育て|介護|雇用|親睦|会費|天引)/;
const RE_ATT   = /(日数|出勤|欠勤|有給|有休|休日|残日|時間|遅刻|早退)/;
const RE_EARN  = /(給|手当|賞与|報酬|割増|インセンティブ|歩合)/;

function cleanLabel(l) {
  return l.replace(/^[\s:：・\-*|｜\[\]【】()]+|[\s:：・\-*|｜\[\]【】円¥]+$/g, "").trim();
}
function toNumber(raw) {
  const neg = /^-/.test(raw);
  const n = parseInt(raw.replace(/[^\d]/g, ""), 10);
  if (isNaN(n)) return null;
  return neg ? -n : n;
}

function parsePayslipText(text) {
  const result = { yearMonth: null, paymentMonth: null, attendance: [], earnings: [], deductions: [], other: [], withholdingAmount: null };
  const seen = new Set();
  let section = null; // fallback from headers like 【支給】
  const lines = normalizeOcrText(text).split("\n").map(joinJapaneseSpaces);

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    // dates (several per line possible, e.g. "2026年7月分 2026年8月25日支給")
    const dateRe = /(?:(20\d{2})|令和\s*(\d{1,2}))\s*年\s*(\d{1,2})\s*月([^\d年]{0,6}(?:\d{1,2}\s*日)?[^\d年]{0,4})/g;
    let dm;
    while ((dm = dateRe.exec(line))) {
      const y = dm[1] ? +dm[1] : 2018 + +dm[2];
      const mo = +dm[3];
      if (!(mo >= 1 && mo <= 12)) continue;
      const ym = y + "-" + String(mo).padStart(2, "0");
      const tail = dm[4] || "";
      if (/分/.test(tail)) { if (!result.yearMonth) result.yearMonth = ym; }
      else if (/支給|支払/.test(tail)) { if (!result.paymentMonth) result.paymentMonth = ym; }
      else if (!result.yearMonth) result.yearMonth = ym;
    }
    let m;

    // withholding slip
    if (/支払金額/.test(line) && result.withholdingAmount === null) {
      const nm = line.match(/(\d{1,3}(?:,\d{3})+|\d{4,})/);
      if (nm) result.withholdingAmount = toNumber(nm[1]);
    }

    // section headers with no numbers
    if (!/\d/.test(line)) {
      if (/勤怠/.test(line)) section = "attendance";
      else if (/控除/.test(line)) section = "deductions";
      else if (/支給/.test(line)) section = "earnings";
      continue;
    }

    // label + number pairs (several may appear on one line)
    const re = /([^\d\s¥,.\-]{2,}?)\s*[:：]?\s*¥?\s*(-?\d{1,3}(?:,\d{3})+|-?\d+(?:\.\d+)?)/g;
    let mm;
    while ((mm = re.exec(line))) {
      const label = cleanLabel(mm[1]);
      if (label.length < 2 || !/[ぁ-んァ-ヶ一-龠]/.test(label)) continue;
      if (RE_SKIP.test(label) || /^(年|月|日|分)$/.test(label)) continue;
      if (/年$|月$/.test(label) && /^\d{1,4}$/.test(mm[2])) continue; // dates like 2026年
      const value = toNumber(mm[2]);
      if (value === null) continue;
      if (seen.has(label)) continue;
      seen.add(label);

      let target;
      if (RE_OTHER.test(label)) target = "other";
      else if (RE_DED.test(label)) target = "deductions";
      else if (RE_ATT.test(label) && !/手当/.test(label)) target = "attendance";
      else if (RE_EARN.test(label)) target = "earnings";
      else target = section;
      if (!target) continue;

      if (target === "attendance") result.attendance.push({ name: label, value: String(value) });
      else result[target].push({ name: label, amount: String(Math.abs(value)) });
    }
  }
  return result;
}

// fills the current form from OCR text; returns how many fields were filled
function applyOcrText(text) {
  const r = parsePayslipText(text);
  const f = state.camForm;
  const mk = (arr, key) => arr.map(it => ({ id: uid(), name: it.name, [key]: it[key], memo: "" }));
  let n = 0;
  if (state.camCategory === "regular") {
    if (r.yearMonth) { f.yearMonth = r.yearMonth; if (!r.paymentMonth) f.paymentMonth = ymAdd(r.yearMonth, 1); }
    else if (r.paymentMonth) { f.yearMonth = ymAdd(r.paymentMonth, -1); }
    if (r.paymentMonth) f.paymentMonth = r.paymentMonth;
    if (r.attendance.length) { f.attendance = mk(r.attendance, "value"); n += r.attendance.length; }
    if (r.earnings.length)   { f.earnings   = mk(r.earnings, "amount");  n += r.earnings.length; }
    if (r.deductions.length) { f.deductions = mk(r.deductions, "amount"); n += r.deductions.length; }
    if (r.other.length)      { f.other      = mk(r.other, "amount");     n += r.other.length; }
  } else if (state.camCategory === "bonus") {
    const earn = r.earnings.concat(r.other);
    if (earn.length)         { f.bonusEarnings   = mk(earn, "amount");         n += earn.length; }
    if (r.deductions.length) { f.bonusDeductions = mk(r.deductions, "amount"); n += r.deductions.length; }
    const ym = r.yearMonth || (r.paymentMonth && ymAdd(r.paymentMonth, -1));
    if (!f.targetYearMonth && ym && findMonth(ym)) f.targetYearMonth = ym;
  } else {
    if (r.withholdingAmount !== null) { f.amount = String(r.withholdingAmount); n += 1; }
    if (r.yearMonth) f.year = r.yearMonth.slice(0, 4);
  }
  return n;
}

/* ============ save (local device only) ============ */
async function saveCamera() {
  const btn = $("#saveCamBtn");
  const statusEl = $("#formStatus");
  btn.disabled = true;
  const f = state.camForm;

  const cleanItems = (list, valueKey) => (list||[])
    .filter(it => (it.name && it.name.trim()) || it[valueKey] !== "")
    .map(it => ({ id: it.id, name: it.name||"", [valueKey]: parseFloat(it[valueKey])||0, memo: it.memo||"" }));

  try {
    let photoDataUrl = f.photoDataUrl || null;
    if (f.photoFile) {
      if (statusEl) statusEl.textContent = "写真を保存中…";
      photoDataUrl = await fileToDataUrl(f.photoFile);
    }

    if (state.camCategory === "regular") {
      if (!f.yearMonth) { alert("対象年月を入力してください。"); btn.disabled=false; return; }
      const existing = findMonth(f.yearMonth) || {};
      const data = {
        yearMonth: f.yearMonth,
        paymentMonth: f.paymentMonth || ymAdd(f.yearMonth,1),
        attendance: cleanItems(f.attendance, "value"),
        earnings: cleanItems(f.earnings, "amount"),
        deductions: cleanItems(f.deductions, "amount"),
        other: cleanItems(f.other, "amount"),
        actualDeposit: f.actualDeposit === "" ? null : parseFloat(f.actualDeposit),
        note: f.note || "",
        regularPhotoDataUrl: photoDataUrl,
        hasBonus: existing.hasBonus || false,
        bonusEarnings: existing.bonusEarnings || [],
        bonusDeductions: existing.bonusDeductions || [],
        bonusPhotoDataUrl: existing.bonusPhotoDataUrl || null,
        updatedAt: new Date().toISOString(),
        createdAt: existing.createdAt || new Date().toISOString(),
      };
      await idbPut("months", data);
      state.currentYM = f.yearMonth;
    } else if (state.camCategory === "bonus") {
      if (!f.targetYearMonth) { alert("追加先の月を選択してください。"); btn.disabled=false; return; }
      const existing = findMonth(f.targetYearMonth);
      if (!existing) { alert("選択した月の明細が見つかりませんでした。"); btn.disabled=false; return; }
      const data = {
        ...existing,
        hasBonus: true,
        bonusEarnings: cleanItems(f.bonusEarnings, "amount"),
        bonusDeductions: cleanItems(f.bonusDeductions, "amount"),
        bonusPhotoDataUrl: photoDataUrl,
        updatedAt: new Date().toISOString(),
      };
      await idbPut("months", data);
      state.currentYM = f.targetYearMonth;
    } else {
      const data = {
        id: "w" + Date.now().toString(36),
        year: f.year || String(new Date().getFullYear()),
        amount: f.amount === "" ? 0 : parseFloat(f.amount),
        memo: f.memo || "",
        photoDataUrl: photoDataUrl,
        updatedAt: new Date().toISOString(),
        createdAt: new Date().toISOString(),
      };
      await idbPut("withholdings", data);
    }
    await reloadLocalData();
    state.view = "home";
    state.camForm = null;
    render();
  } catch (e) {
    console.error(e);
    if (statusEl) { statusEl.classList.add("err"); statusEl.textContent = "保存に失敗しました。もう一度お試しください。"; }
    btn.disabled = false;
  }
}

initCapabilities();
})();
</script>
</body>
</html>
